  content: "you must give a uname -r first. That is your current linux/meego build. \n\nIf you have the current build please use the following command:\n\nsudo cp wl.ko /lib/modules/CURRENTBUILD/kernel/drivers/net/wireless\n\nHope this helps!\n\nRegards,\nThomas"
