name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  # Anything other than "production" renders noindex.
  HUGO_ENVIRONMENT: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Build and validate
        # baseURL comes from hugo.yaml (https://blog.wapnet.nl).
        run: |
          hugo --minify --gc --environment "$HUGO_ENVIRONMENT"
          python3 tools/validate.py
          # Old WordPress feed URL; Pages has no redirects, so serve the RSS there too.
          # ponytail: Pages serves this as text/html; most readers sniff RSS anyway. Move hosting if a reader needs the real MIME type.
          mkdir -p public/feed && cp public/feed.xml public/feed/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
